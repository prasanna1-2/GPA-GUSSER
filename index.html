<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calculator</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(to right,#ffe5ec,#fff0f5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:20px;
border-radius:15px;
width:350px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
text-align:center;
}

h2{
color:#d63384;
margin-bottom:15px;
}

input{
width:90%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:95%;
padding:12px;
margin-top:10px;
background:#ff66b2;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff3399;
}

.result{
margin-top:15px;
background:#fff0f5;
padding:15px;
border-radius:10px;
font-size:16px;
}

.footer{
margin-top:10px;
font-size:13px;
color:#777;
}

</style>
</head>

<body>

<div class="container">

<h2>🌸 GPA Calculator 🌺</h2>

<input type="text" id="studentName" placeholder="Enter Your Name">

<input type="number" id="cmaths" placeholder="C. Maths (0-50)">
<input type="number" id="english" placeholder="English (0-50)">
<input type="number" id="nepali" placeholder="Nepali (0-50)">
<input type="number" id="science" placeholder="Science (0-50)">
<input type="number" id="samagik" placeholder="Samagik (0-50)">
<input type="number" id="omaths" placeholder="O. Maths (0-50)">
<input type="number" id="hamro" placeholder="Hamro Panauti (0-50)">
<input type="number" id="account" placeholder="Account (0-50)">
<input type="number" id="health" placeholder="Health (0-50)">

<button onclick="calculateGPA()">Calculate GPA</button>

<div class="result" id="result"></div>

<div class="footer">
Design by <b>Prasanna Sapkota</b>
</div>

</div>

<script>

function getGradePoint(mark){

if(mark >= 45) return 4.0;
else if(mark >= 40) return 3.6;
else if(mark >= 35) return 3.2;
else if(mark >= 30) return 2.8;
else if(mark >= 25) return 2.4;
else if(mark >= 20) return 2.0;
else return "NG";

}

function calculateGPA(){

let studentName=document.getElementById("studentName").value.trim();

if(studentName===""){
alert("Please enter your name");
return;
}

let subjects=[
cmaths.value,english.value,nepali.value,science.value,
samagik.value,omaths.value,hamro.value,account.value,health.value
];

let totalMarks=0;
let totalGP=0;

for(let i=0;i<subjects.length;i++){

let mark=Number(subjects[i]);

if(mark<0||mark>50||subjects[i]===""){
alert("Enter valid marks (0-50)");
return;
}

totalMarks+=mark;

let gp=getGradePoint(mark);

if(gp==="NG"){
document.getElementById("result").innerHTML=
"<b>Name:</b> "+studentName+
"<br><b>Result:</b> NG (Failed in one subject)";
return;
}

totalGP+=gp;

}

let gpa=totalGP/subjects.length;

document.getElementById("result").innerHTML=
"<b>Name:</b> "+studentName+
"<br><b>Total Marks:</b> "+totalMarks+" / 450"+
"<br><b>Final GPA:</b> "+gpa.toFixed(2);

}

</script>

</body>
</html>
